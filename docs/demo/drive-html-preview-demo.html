<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q3 Sales Report</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6e6e73; --line:#e6e6ea; --brand:#e34f26; --brand2:#f06529; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; color:var(--ink); background:#fafafa; }
  header { background: linear-gradient(120deg, #1f2937, #111827); color:#fff; padding:48px 56px 64px; }
  header small { color:#fca5a5; letter-spacing:.12em; font-weight:700; }
  header h1 { margin:10px 0 8px; font-size:40px; letter-spacing:-.01em; }
  header p { margin:0; color:#d1d5db; font-size:16px; }
  main { max-width:1100px; margin:-36px auto 48px; padding:0 24px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:0 8px 24px rgba(0,0,0,.05); }
  .kpi b { display:block; font-size:30px; margin-top:6px; }
  .kpi span { color:var(--muted); font-size:13px; }
  .up { color:#16a34a; font-size:13px; font-weight:700; }
  .grid { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-top:16px; }
  h2 { font-size:16px; margin:0 0 14px; }
  .bars { display:flex; align-items:flex-end; gap:14px; height:200px; padding-top:10px; }
  .bar { flex:1; border-radius:8px 8px 0 0; background:linear-gradient(180deg,var(--brand2),var(--brand)); position:relative; transform-origin:bottom; animation:grow .9s cubic-bezier(.2,.8,.2,1) both; }
  .bar::after { content:attr(data-label); position:absolute; bottom:-22px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted); }
  @keyframes grow { from { transform:scaleY(0); } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:10px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-weight:700; }
  button { margin-top:14px; border:0; border-radius:999px; padding:10px 18px; background:var(--ink); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  #status { margin-left:10px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <small>DRIVE HTML PREVIEW · DEMO</small>
  <h1>2026年 第3四半期 売上レポート</h1>
  <p>Google ドライブに保存した HTML が、そのまま Web ページとして表示されています。</p>
</header>
<main>
  <section class="kpis">
    <div class="card kpi"><span>売上高</span><b>¥128.4M</b><em class="up">▲ 18.2%</em></div>
    <div class="card kpi"><span>新規顧客</span><b>1,284</b><em class="up">▲ 9.7%</em></div>
    <div class="card kpi"><span>解約率</span><b>1.9%</b><em class="up">▼ 0.4pt</em></div>
    <div class="card kpi"><span>NPS</span><b>62</b><em class="up">▲ 5</em></div>
  </section>
  <section class="grid">
    <div class="card">
      <h2>月別売上（百万円）</h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="card">
      <h2>地域別</h2>
      <table>
        <tr><td>関東</td><td>¥52.1M</td></tr>
        <tr><td>関西</td><td>¥31.8M</td></tr>
        <tr><td>中部</td><td>¥19.6M</td></tr>
        <tr><td>九州</td><td>¥14.2M</td></tr>
        <tr><td>その他</td><td>¥10.7M</td></tr>
      </table>
      <button id="run" type="button">JavaScript を実行</button><span id="status"></span>
    </div>
  </section>
</main>
<script>
  const data = [['4月', 31], ['5月', 36], ['6月', 34], ['7月', 41], ['8月', 44], ['9月', 43]];
  const max = Math.max(...data.map(d => d[1]));
  const bars = document.getElementById('bars');
  data.forEach(([label, v], i) => {
    const el = document.createElement('div');
    el.className = 'bar';
    el.dataset.label = label;
    el.style.height = (v / max * 100) + '%';
    el.style.animationDelay = (i * 70) + 'ms';
    bars.appendChild(el);
  });
  document.getElementById('run').addEventListener('click', () => {
    document.getElementById('status').textContent = 'スクリプトは正常に動作しています ✓';
  });
  document.body.dataset.scriptRan = 'yes';
</script>
</body>
</html>
